<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
</head>
<body style="min-height: 800px;">
  <h1>Cadastro</h1>
  <form id="formCadastro">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <button id="btnCadastrar" type="button">Cadastrar</button>
    <button id="btnAtualizar" type="button">Atualizar</button>
    <button id="btnApagar" type="button">Deletar</button>
    <button id="btnBuscar" type="button">Pesquisar</button>
  </form>

  <div id="mensagem"></div>

  <script src="rota.js"></script>
</body>
</html>
